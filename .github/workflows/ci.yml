name: Nexora CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Compile backend
        run: python -m compileall -q backend
      - name: Run backend regression tests
        env:
          MONGO_URL: mongodb://127.0.0.1:27017
          DB_NAME: nexora_ci
          JWT_SECRET: ci-only-secret-that-is-longer-than-thirty-two-characters
          PYTHONPATH: backend
        run: python -m pytest -q backend/tests/test_global_core.py backend/tests/test_hardening.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile
      - name: Build frontend
        env:
          CI: 'true'
          REACT_APP_BACKEND_URL: https://api.example.invalid
        run: yarn build
